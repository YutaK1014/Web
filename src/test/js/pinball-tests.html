<!doctype html>
<meta charset="utf-8">
<title>Pinball browser tests</title>
<pre id="results">RUNNING</pre>
<iframe id="home" src="../../main/resources/templates/home.html"></iframe>
<script>
document.getElementById('home').onload = async function () {
  const win = this.contentWindow, doc = win.document, checks = [];
  const assert = (condition, name) => { if (!condition) throw Error(name); checks.push('PASS ' + name); };
  try {
    let callback, time = 100;
    const browserFrame = win.requestAnimationFrame.bind(win);
    Object.defineProperty(doc, 'hidden', { configurable: true, value: false });
    win.requestAnimationFrame = fn => { callback = fn; return 1; };
    win.cancelAnimationFrame = () => { callback = null; };
    const script = doc.createElement('script');
    script.charset = 'utf-8';
    script.src = new URL('../../main/resources/static/js/pinball.js', location.href);
    await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; doc.body.append(script); });
    const dialog = doc.getElementById('pinball');
    const closeAndWait = (element, action) => new Promise((resolve, reject) => {
      // Keep virtual time advancing while Chrome delivers the queued close event.
      const pulse = setInterval(() => {}, 10);
      const timeout = setTimeout(() => { clearInterval(pulse); reject(Error('close event timed out')); }, 1000);
      element.addEventListener('close', () => { clearInterval(pulse); clearTimeout(timeout); resolve(); }, { once: true });
      action();
      browserFrame(() => {});
    });
    const sequence = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    const key = (value, target = doc.body, extras = {}) => target.dispatchEvent(new win.KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true, ...extras }));
    const enter = (target = doc.body) => sequence.forEach(value => key(value, target));
    const advance = seconds => { for (let i = 0; i < seconds * 60; i++) { const fn = callback; callback = null; time += 1000 / 60; if (fn) fn(time); } };
    assert(!dialog.open, 'initially hidden');
    const input = doc.getElementById('purchase-item');
    input.value = 'keep me'; input.focus(); enter(input);
    assert(!dialog.open, 'form typing ignored'); input.blur();
    sequence.slice(0, 4).forEach(value => key(value)); key('x'); sequence.slice(4).forEach(value => key(value));
    assert(!dialog.open, 'wrong command rejected');
    enter();
    assert(dialog.open && doc.activeElement.id === 'pinball-table', 'command opens game');
    assert(doc.getElementById('pinball-score').textContent === '0', 'initial score zero');
    key(' ', doc.activeElement, { code: 'Space' });
    assert(doc.getElementById('pinball-launch').disabled, 'Space launches');
    advance(30);
    assert(Number(doc.getElementById('pinball-score').textContent.replaceAll(',', '')) > 0, 'bumper scores');
    assert(!doc.getElementById('pinball-launch').disabled, 'drain allows relaunch');
    const score = doc.getElementById('pinball-score').textContent;
    doc.getElementById('pinball-launch').click();
    assert(doc.getElementById('pinball-score').textContent === score, 'relaunch preserves score');
    key('ArrowLeft'); advance(1);
    assert(doc.querySelector('[data-flipper="left"]').getAttribute('aria-pressed') === 'true', 'flipper responds');
    win.dispatchEvent(new win.Event('blur')); advance(1);
    assert(doc.querySelector('[data-flipper="left"]').getAttribute('aria-pressed') === 'false', 'blur releases controls');
    advance(180); assert(dialog.open, 'no time limit');
    await closeAndWait(dialog, () => doc.getElementById('pinball-back').click());
    assert(!dialog.open && !callback, 'return stops animation');
    assert(input.value === 'keep me', 'form preserved');
    enter(); assert(dialog.open && doc.getElementById('pinball-score').textContent === '0', 'reopen resets');
    await closeAndWait(dialog, () => dialog.close());
    const secret = doc.getElementById('pinball-secret');
    const codeDialog = doc.getElementById('pinball-code');
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const pointer = (type, target = secret, extras = {}) => target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, pointerId: 1, pointerType: 'touch', isPrimary: true, button: 0, clientX: 10, clientY: 10, ...extras }));
    pointer('pointerdown'); pointer('pointerup'); await wait(750);
    assert(!codeDialog.open, 'short tap does not reveal command pad');
    pointer('pointerdown'); pointer('pointermove', win, { clientY: 40 }); await wait(750);
    assert(!codeDialog.open, 'scroll gesture cancels long press');
    pointer('pointerdown'); pointer('pointercancel'); await wait(750);
    assert(!codeDialog.open, 'cancelled touch does not reveal pad');
    pointer('pointerdown'); await wait(750); pointer('pointerup');
    assert(codeDialog.open, 'long press reveals touch command pad');
    const tap = value => { const button = codeDialog.querySelector(`[data-command="${value}"]`); button.focus(); button.click(); };
    sequence.slice(0, 4).forEach(tap); tap('a'); sequence.slice(4).forEach(tap);
    assert(!dialog.open, 'wrong touch command rejected');
    sequence.forEach(tap);
    assert(dialog.open && !codeDialog.open, 'touch command opens game after changing button focus');
    await closeAndWait(dialog, () => doc.getElementById('pinball-back').click());
    assert(!dialog.open && doc.activeElement === secret && input.value === 'keep me', 'touch game returns to home and preserves input');
    secret.click();
    assert(codeDialog.open, 'accessible logo activation opens pad');
    tap('ArrowUp'); await closeAndWait(codeDialog, () => doc.getElementById('pinball-code-close').click());
    secret.click();
    assert(doc.getElementById('pinball-code-progress').textContent.includes('0 / 10'), 'closing pad resets command');
    doc.getElementById('pinball-code-close').click();
    document.getElementById('results').textContent = 'ALL PASSED\n' + checks.join('\n');
  } catch (error) { document.getElementById('results').textContent = checks.join('\n') + '\nFAIL ' + error.stack; }
};
</script>
