# Disposable shared portfolio demo. Never connect this profile to personal data.
app.demo=true
server.address=0.0.0.0
server.forward-headers-strategy=native
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port
spring.datasource.url=jdbc:h2:mem:cashflow-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.data-locations=classpath:demo-data.sql
spring.h2.console.enabled=false
