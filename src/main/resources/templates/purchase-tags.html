<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body><main class="form-page"><nav th:replace="~{fragments :: nav}"></nav>
<header><h1>購入履歴のタグを編集</h1><p th:text="${purchase.itemName}"></p></header>
<form class="transaction-form" th:action="@{/purchases/{id}/tags(id=${purchase.id})}" th:object="${tagForm}" method="post">
<div class="error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
<div class="field"><label for="tags">タグ<span class="optional">任意</span></label>
<input th:field="*{tags}" maxlength="1000" placeholder="例：衣類, プレゼント" aria-describedby="tag-hint">
<p id="tag-hint" class="hint">カンマまたは「、」で区切って入力。1つ30文字以内、10個まで。空欄で保存するとタグをすべて外せます。</p></div>
<div class="form-actions"><button class="button" type="submit">タグを保存する</button><a th:href="@{/#purchase-history}">購入履歴に戻る</a></div>
</form></main></body></html>
