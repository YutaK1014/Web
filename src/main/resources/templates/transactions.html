<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>取引一覧 | もうけメモ</title>
    <link rel="stylesheet" th:href="@{/css/transactions.css}">
</head>
<body>
<main>
    <header>
        <p class="brand">もうけメモ</p>
        <h1>取引一覧</h1>
        <p>売れた商品の価格や送料、利益を確認できます。</p>
    </header>
    <p class="error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <section class="empty" th:if="${errorMessage == null and #lists.isEmpty(transactions)}">
        <h2>取引はまだありません</h2>
        <p>取引データが登録されると、ここに一覧が表示されます。</p>
    </section>
    <div class="table-container" tabindex="0" role="region" aria-label="取引一覧。横にスクロールできます。"
         th:if="${not #lists.isEmpty(transactions)}">
        <table>
            <caption>販売日が新しい順に表示しています。</caption>
            <thead>
            <tr>
                <th scope="col">写真</th>
                <th scope="col">商品名</th>
                <th scope="col" class="amount">価格</th>
                <th scope="col" class="amount">送料</th>
                <th scope="col" class="amount">利益</th>
                <th scope="col">取引プラットフォーム</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="transaction : ${transactions}">
                <td>
                    <img class="photo" th:if="${transaction.photoUrl != null}"
                         th:src="@{${transaction.photoUrl}}" th:alt="${transaction.itemName + 'の写真'}" loading="lazy">
                    <span class="no-photo" th:if="${transaction.photoUrl == null}">写真なし</span>
                </td>
                <th scope="row" class="item-name" th:text="${transaction.itemName}"></th>
                <td class="amount" th:text="${#numbers.formatInteger(transaction.sellingPrice, 1, 'COMMA') + '円'}"></td>
                <td class="amount" th:text="${#numbers.formatInteger(transaction.shippingCost, 1, 'COMMA') + '円'}"></td>
                <td class="amount profit" th:classappend="${transaction.profit < 0} ? 'negative' : ''"
                    th:text="${#numbers.formatInteger(transaction.profit, 1, 'COMMA') + '円'}"></td>
                <td th:text="${transaction.platformName}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="note">利益は、価格から販売手数料・送料・仕入価格を差し引いた金額です。</p>
</main>
</body>
</html>
