<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body><main class=""><nav th:replace="~{fragments :: nav}"></nav>
<header class="hero"><p class="brand">もうけメモ</p><h1>売った利益が、すぐわかる。</h1>
<p>売却済み商品の売上・手数料・送料・仕入価格を記録して、利益を確認。<br>メルカリ・ラクマ・Yahoo!フリマなどの収支を、ひとつにまとめます。</p>
<div class="form-actions"><a class="button" th:href="@{/dashboard}">ダッシュボードを開く</a><a th:href="@{/transactions/new}">取引を登録する</a></div></header>
<section class="summary-grid"><div><h2>利益を自動計算</h2><p>手数料や送料を差し引いた金額がわかります。</p></div>
<div><h2>収支を振り返る</h2><p>月別・年間・サイト別に集計できます。</p></div>
<div><h2>商品を探す</h2><p>商品名や販売日で、過去の取引を絞り込めます。</p></div></section>
<p>初めて使うときは、<a th:href="@{/settings}">設定</a>で手数料率と端数処理を選択してください。</p>
</main></body></html>
