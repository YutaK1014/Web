<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body><main class=""><nav th:replace="~{fragments :: nav}"></nav>
<h1>ダッシュボード</h1><h2 th:text="${month + ' の収支'}"></h2>
<section th:replace="~{fragments :: summary(${summary})}"></section>
<p th:if="${goal != null}">月間利益目標：<strong th:text="${#numbers.formatInteger(goal,1,'COMMA') + '円'}"></strong>
<span th:text="${summary.profit >= goal ? '達成しました' : 'あと ' + #numbers.formatInteger(goal - summary.profit,1,'COMMA') + '円'}"></span></p>
<h2>最近の取引</h2><p th:if="${#lists.isEmpty(recent)}">取引はまだありません。<a th:href="@{/transactions/new}">最初の取引を登録する</a></p>
<ul class="recent"><li th:each="row : ${recent}"><a th:href="@{/transactions/{id}/edit(id=${row.id})}" th:text="${row.itemName}"></a>
<span th:text="${row.soldDate}"></span><strong th:text="${#numbers.formatInteger(row.profit,1,'COMMA') + '円'}"></strong></li></ul>
<h2>今年の月別利益</h2><section th:replace="~{fragments :: chart(${chart})}"></section>
<h2>今月のサイト別集計</h2><div th:replace="~{fragments :: groups(${marketplaces}, '今月のサイト別収支')}"></div>
</main></body></html>
